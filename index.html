<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Cursor</title>
    <style>
        body { background-color: transparent; margin: 0; padding: 0; overflow: hidden; font-family: monospace; }
        #video { 
            position: fixed; bottom: 10px; right: 10px; width: 80px; height: 60px; 
            border: 1px solid #00ff00; transform: scaleX(-1); z-index: 100; border-radius: 5px; opacity: 0.5;
        } 
        #status { color: #00ff00; position: fixed; top: 10px; left: 10px; font-size: 10px; z-index: 100; }
    </style>
</head>
<body>
    <div id="status">Air Cursor Active</div>
    <video id="video" autoplay playsinline muted></video>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script>
        window.onload = function() {
            const video = document.getElementById('video');
            let handsInstance = null;
            let cameraInstance = null;
            let isPinching = false;
            
            let smoothX = window.innerWidth / 2;
            let smoothY = window.innerHeight / 2;
            const smoothingFactor = 0.25;

            async function onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const hand = results.multiHandLandmarks[0];
                    const indexTip = hand[8];
                    const thumbTip = hand[4];
                    
                    const targetX = (1 - indexTip.x) * window.innerWidth; 
                    const targetY = indexTip.y * window.innerHeight;

                    // Apply Artificial Smoothening
                    smoothX += (targetX - smoothX) * smoothingFactor;
                    smoothY += (targetY - smoothY) * smoothingFactor;

                    if (window.AndroidCursor) window.AndroidCursor.moveCursor(smoothX, smoothY);

                    const dx = thumbTip.x - indexTip.x;
                    const dy = thumbTip.y - indexTip.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 0.05 && !isPinching) {
                        isPinching = true;
                        if (window.AndroidCursor) window.AndroidCursor.triggerClick(smoothX, smoothY);
                    } else if (distance >= 0.05 && isPinching) {
                        isPinching = false;
                    }
                }
            }

            async function initCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                    video.srcObject = stream;
                    await video.play();

                    handsInstance = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                    handsInstance.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                    handsInstance.onResults(onResults);

                    cameraInstance = new Camera(video, { onFrame: async () => { if (handsInstance) await handsInstance.send({ image: video }); }, width: 640, height: 480 });
                    await cameraInstance.start();
                } catch (err) {
                    console.error("FATAL: " + err.message);
                }
            }
            initCamera();
        };
    </script>
</body>
</html>
