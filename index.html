<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Cursor</title>
    <style>
        body { background-color: black; margin: 0; padding: 0; overflow: hidden; font-family: monospace; }
        #video { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 160px; 
            height: 120px; 
            border: 2px solid #00ff00; 
            transform: scaleX(-1); 
            z-index: 10;
        } 
        #status { color: #00ff00; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; font-size: 18px; }
        #log-box {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 90%;
            height: 200px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            border: 1px solid #00ff00;
            font-size: 12px;
            z-index: 20;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <!-- Copyable Log Box -->
    <textarea id="log-box" readonly></textarea>
    
    <div id="status">Initializing Air Cursor...</div>
    <video id="video" autoplay playsinline muted></video>
    
    <!-- Load MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script>
        window.onload = function() {
            const video = document.getElementById('video');
            const statusDiv = document.getElementById('status');
            const logBox = document.getElementById('log-box');
            let handsInstance = null;
            let cameraInstance = null;
            let isPinching = false;
            let lastGesture = "";

            // Fallback for web browser testing
            const AndroidCursor = window.AndroidCursor || {
                moveCursor: (x, y) => {},
                triggerClick: (x, y) => log(`WEB_TEST: Click at ${Math.round(x)}, ${Math.round(y)}`)
            };

            function log(msg) {
                const time = new Date().toLocaleTimeString();
                const entry = `[${time}] ${msg}\n`;
                logBox.value = entry + logBox.value; // Prepend new logs
                // Keep log to last 15 lines
                if (logBox.value.split('\n').length > 15) {
                    logBox.value = logBox.value.split('\n').slice(0, 15).join('\n');
                }
                console.log(msg);
            }

            function detectGesture(hand) {
                // Check if fingers are extended (tip y < pip y = extended upwards)
                const indexExt = hand[8].y < hand[6].y;
                const middleExt = hand[12].y < hand[10].y;
                const ringExt = hand[16].y < hand[14].y;
                const pinkyExt = hand[20].y < hand[18].y;
                
                // Pinch distance
                const dx = hand[4].x - hand[8].x;
                const dy = hand[4].y - hand[8].y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 0.05) return "PINCH";
                if (indexExt && middleExt && ringExt && pinkyExt) return "OPEN PALM";
                if (!indexExt && !middleExt && !ringExt && !pinkyExt) return "FIST";
                if (indexExt && !middleExt && !ringExt && !pinkyExt) return "POINTING";
                
                return "UNKNOWN";
            }

            async function onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const hand = results.multiHandLandmarks[0];
                    const indexTip = hand[8];
                    const thumbTip = hand[4];
                    
                    const gesture = detectGesture(hand);
                    
                    // Log if gesture changes
                    if (gesture !== lastGesture) {
                        log(`Gesture: ${gesture}`);
                        lastGesture = gesture;
                        statusDiv.innerText = gesture;
                    }

                    const screenX = (1 - indexTip.x) * window.innerWidth; 
                    const screenY = indexTip.y * window.innerHeight;

                    AndroidCursor.moveCursor(screenX, screenY);

                    if (gesture === "PINCH" && !isPinching) {
                        isPinching = true;
                        log(`Action: PINCH CLICK TRIGGERED`);
                        AndroidCursor.triggerClick(screenX, screenY);
                    } else if (gesture !== "PINCH" && isPinching) {
                        isPinching = false;
                    }
                } else {
                    if (lastGesture !== "NO HAND") {
                        log("Status: No hand detected");
                        lastGesture = "NO HAND";
                        statusDiv.innerText = "Show your hand";
                    }
                }
            }

            async function initCamera() {
                try {
                    statusDiv.innerText = "Requesting Camera...";
                    log("System: Requesting getUserMedia");
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                    video.srcObject = stream;
                    await video.play();
                    log("System: Camera stream acquired");
                    statusDiv.innerText = "Camera Active. Loading AI...";

                    if (typeof Hands === 'undefined') {
                        throw new Error("MediaPipe Hands library not loaded.");
                    }

                    handsInstance = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                    handsInstance.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                    handsInstance.onResults(onResults);
                    log("System: MediaPipe Hands initialized");

                    if (typeof Camera === 'undefined') {
                        throw new Error("MediaPipe Camera utility not loaded.");
                    }

                    cameraInstance = new Camera(video, {
                        onFrame: async () => { if (handsInstance) await handsInstance.send({ image: video }); },
                        width: 640, height: 480
                    });
                    await cameraInstance.start();
                    log("System: Camera loop started successfully");
                    statusDiv.innerText = "Ready. Show hand.";
                } catch (err) {
                    log(`FATAL: ${err.name} - ${err.message}`);
                    statusDiv.innerText = "Camera Error. See log.";
                }
            }

            initCamera();
        };
    </script>
</body>
</html>
