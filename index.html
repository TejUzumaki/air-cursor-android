<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Cursor Magic Testbed</title>
    <style>
        body { background-color: #111; margin: 0; padding: 0; overflow-x: hidden; font-family: monospace; color: #fff; height: 3000px; } /* Tall body for scrolling */
        #video { position: fixed; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #00ff00; transform: scaleX(-1); z-index: 100; border-radius: 10px; }
        #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-size: 20px; z-index: 100; text-align: center; width: 100%; background: rgba(0,0,0,0.5); padding: 5px; }
        #log-box { position: fixed; top: 60px; left: 10px; width: 60%; height: 100px; background: rgba(0,0,0,0.7); border: 1px solid #00ff00; font-size: 12px; z-index: 100; overflow: hidden; color: #0f0; white-space: pre-wrap; pointer-events: none; }
        #copy-btn { position: fixed; top: 60px; right: 10px; padding: 10px; background: #00ff00; color: #000; border: none; border-radius: 5px; font-weight: bold; z-index: 100; }
        #web-cursor { position: fixed; width: 20px; height: 20px; background: rgba(255, 0, 0, 0.5); border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 90; pointer-events: none; transition: transform 0.1s; }
        .target { position: absolute; width: 60px; height: 60px; background: #ff00ff; border: 2px solid #fff; border-radius: 10px; z-index: 50; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
        .burst { animation: burstAnim 0.3s ease-out forwards; }
        @keyframes burstAnim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .spacer { height: 1000px; }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <div id="log-box"></div>
    <button id="copy-btn" onclick="copyLogs()">Copy Logs</button>
    
    <div id="targets-container"></div>
    <div id="web-cursor"></div>
    <div class="spacer"></div> <!-- Allows scrolling -->
    <video id="video" autoplay playsinline muted></video>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script>
        const logHistory = [];
        const oldLog = console.log;
        console.log = function(msg) {
            logHistory.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
            if (logHistory.length > 10) logHistory.shift();
            document.getElementById('log-box').innerText = logHistory.join('\n');
            oldLog.apply(console, arguments);
        };

        function copyLogs() {
            navigator.clipboard.writeText(logHistory.join('\n')).then(() => alert("Logs Copied!"));
        }

        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const webCursor = document.getElementById('web-cursor');
        const targetsContainer = document.getElementById('targets-container');
        let handsInstance = null;
        let cameraInstance = null;
        let isPinching = false;
        
        // Smoothening Variables
        let smoothX = window.innerWidth / 2;
        let smoothY = window.innerHeight / 2;
        const smoothingFactor = 0.25;
        
        // Scrolling Variables
        let prevScrollY = 0;

        const AndroidCursor = window.AndroidCursor || {
            moveCursor: (x, y) => { webCursor.style.left = x + 'px'; webCursor.style.top = y + 'px'; },
            triggerClick: (x, y) => { checkTargetHit(x, y); }
        };

        const targets = [];
        function createTarget(top) {
            const t = document.createElement('div');
            t.className = 'target';
            t.innerText = 'PINCH';
            t.style.left = (Math.random() * (window.innerWidth - 80)) + 'px';
            t.style.top = top + 'px';
            targetsContainer.appendChild(t);
            targets.push(t);
        }

        function checkTargetHit(x, y) {
            targets.forEach(t => {
                const rect = t.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    console.log("Target HIT! Bursting...");
                    t.classList.add('burst');
                    setTimeout(() => {
                        t.classList.remove('burst');
                        t.style.left = (Math.random() * (window.innerWidth - 80)) + 'px';
                        t.style.top = (window.scrollY + Math.random() * 1000) + 'px';
                    }, 300);
                }
            });
        }

        function detectPose(hand, handedness) {
            const indexExt = hand[8].y < hand[6].y;
            const middleExt = hand[12].y < hand[10].y;
            const ringExt = hand[16].y < hand[14].y;
            const pinkyExt = hand[20].y < hand[18].y;
            
            const dx = hand[4].x - hand[8].x;
            const dy = hand[4].y - hand[8].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const isPinch = dist < 0.05;

            let poseStr = `${handedness} | I:${indexExt?'U':'D'} M:${middleExt?'U':'D'} R:${ringExt?'U':'D'} P:${pinkyExt?'U':'D'}`;
            let isFist = false;
            
            if (isPinch) poseStr = `${handedness} | PINCH`;
            else if (indexExt && middleExt && ringExt && pinkyExt) poseStr = `${handedness} | OPEN PALM`;
            else if (!indexExt && !middleExt && !ringExt && !pinkyExt) { poseStr = `${handedness} | FIST`; isFist = true; }
            
            return { poseStr, isPinch, isFist };
        }

        async function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const handedness = results.multiHandedness[0].label.toUpperCase();
                const { poseStr, isPinch, isFist } = detectPose(hand, handedness);
                statusDiv.innerText = poseStr;

                const indexTip = hand[8];
                const targetX = (1 - indexTip.x) * window.innerWidth;
                const targetY = indexTip.y * window.innerHeight;

                // 1. Artificial Smoothening (Lerp)
                smoothX += (targetX - smoothX) * smoothingFactor;
                smoothY += (targetY - smoothY) * smoothingFactor;

                // 2. Magnetic Snapping
                let snapped = false;
                targets.forEach(t => {
                    const rect = t.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const distToTarget = Math.sqrt((smoothX - cx)**2 + (smoothY - cy)**2);
                    if (distToTarget < 80) {
                        smoothX += (cx - smoothX) * 0.5; // Snap towards center
                        smoothY += (cy - smoothY) * 0.5;
                        webCursor.style.transform = 'translate(-50%, -50%) scale(1.8)';
                        webCursor.style.background = 'rgba(0, 255, 0, 0.8)';
                        snapped = true;
                    }
                });
                if (!snapped) {
                    webCursor.style.transform = 'translate(-50%, -50%) scale(1)';
                    webCursor.style.background = 'rgba(255, 0, 0, 0.5)';
                }

                AndroidCursor.moveCursor(smoothX, smoothY);

                // 3. Gesture Scrolling (Fist Up/Down)
                if (isFist) {
                    const currentY = hand[0].y; // Wrist Y
                    if (prevScrollY !== 0) {
                        const diff = currentY - prevScrollY;
                        if (Math.abs(diff) > 0.005) {
                            window.scrollBy(0, diff * 2000);
                        }
                    }
                    prevScrollY = currentY;
                } else {
                    prevScrollY = 0;
                }

                // Pinch Click Logic
                if (isPinch && !isPinching) {
                    isPinching = true;
                    console.log(`Action: PINCH at ${Math.round(smoothX)}, ${Math.round(smoothY)}`);
                    AndroidCursor.triggerClick(smoothX, smoothY);
                } else if (!isPinch && isPinching) {
                    isPinching = false;
                }
            } else {
                statusDiv.innerText = "NO HAND DETECTED";
                prevScrollY = 0;
            }
        }

        async function initCamera() {
            try {
                statusDiv.innerText = "Requesting Camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                video.srcObject = stream;
                await video.play();

                handsInstance = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                handsInstance.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                handsInstance.onResults(onResults);

                cameraInstance = new Camera(video, { onFrame: async () => { if (handsInstance) await handsInstance.send({ image: video }); }, width: 640, height: 480 });
                await cameraInstance.start();
                statusDiv.innerText = "Ready. Show hand.";
                
                // Initialize targets at different scroll heights
                createTarget(200);
                createTarget(800);
                createTarget(1500);
            } catch (err) {
                console.log(`FATAL: ${err.name} - ${err.message}`);
            }
        }

        window.onload = initCamera;
    </script>
</body>
</html>
